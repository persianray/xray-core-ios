# Build official LibXray.xcframework (Apple / iOS) from XTLS/libXray.
#
# After the run finishes: Actions → this workflow → Artifacts → LibXray.xcframework
# Unzip, copy the xcframework to persianray-ios/Vendor/LibXray/LibXray.xcframework
# then set `useRealLibXray = true` in Package.swift and rebuild with xtool.
name: libxray-apple

on:
  workflow_dispatch:

concurrency:
  group: libxray-apple
  cancel-in-progress: true

jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout XTLS/libXray
        uses: actions/checkout@v4
        with:
          repository: XTLS/libXray
          path: libXray

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Go modules
        working-directory: libXray
        run: go mod download

      - name: Build Apple xcframework
        working-directory: libXray
        run: python3 build/main.py apple go

      - name: Upload LibXray.xcframework
        uses: actions/upload-artifact@v4
        with:
          name: LibXray.xcframework
          path: libXray/LibXray.xcframework
          if-no-files-found: error
